services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collabflow
      POSTGRES_USER: collabflow
      POSTGRES_PASSWORD: collabflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabflow -d collabflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DEMO_MODE: "false"
      JWT_SECRET: local-compose-change-before-production
      DATABASE_URL: postgresql://collabflow:collabflow@postgres:5432/collabflow
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports: ["4000:4000"]
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    ports: ["5173:80"]
    networks: [frontend]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
